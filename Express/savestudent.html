<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Student</title>
    <link rel="stylesheet" href="style.css" type="text/css">
    <style>
        /* Form specific styling that adapts to your theme */
        .form-container {
            max-width: 400px;
            margin: 40px auto;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #007bff; /* Change this to match your site's primary color */
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .submit-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">MyWebsite</div>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/contact">Contact</a></li>
                <li><a href="/add-student-page" class="active">Add Student</a></li>
                <li><a href="/view-students-page">View Students</a></li>
            </ul>
        </nav>
    </header>

    <main class="hero-section" style="height: auto; padding: 40px 20px;">
        <div class="hero-content">
            <h1>Add New Student</h1>
            <p>Enter the details below to store the student record securely in the database.</p>
            
            <div class="form-container">
                <form action="/savestudent" method="POST">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name"  placeholder="Enter student's name">
                    </div>

                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" name="age"  placeholder="Enter age">
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" >
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <button type="submit" class="submit-btn">Save Record</button>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
